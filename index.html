<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCompensar Espacios · Mockup funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><img src="assets/logo-compensar.png" alt="Compensar Fundación Universitaria"><div><h1>UCompensar Espacios</h1><p class="sub">Consulta y reserva de espacios académicos</p></div></div>
  <div class="seg" role="group" aria-label="Rol de la sesión de prueba">
    <button data-role="usuario" aria-pressed="true">Usuario: Ana Prueba</button>
    <button data-role="gestor" aria-pressed="false">Gestor: Admin Prueba</button>
  </div>
</header>
<div class="banner">Mockup académico con datos sintéticos. No está conectado al portal institucional y los cambios se pierden al recargar.</div>
<nav role="tablist" id="nav"></nav>
<main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
